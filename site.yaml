  para-quien:
    activa: true
    antetitulo: Para quién trabajamos
    titulo: Del ayuntamiento al vecino que hace una piscina
    texto: Cada cliente pide una cosa distinta. La máquina y el cuidado son los mismos.
    items:
      - { titulo: Constructoras, texto: "Vaciados, zanjas y explanadas para que la obra empiece el día previsto." }
      - { titulo: Ayuntamientos, texto: "Saneamiento, agua, caminos y urbanizaciones, por contrato menor o licitación." }
      - { titulo: Agricultores, texto: "Balsas, nivelación de fincas, desbroces y caminos de acceso." }
      - { titulo: Particulares, texto: "Piscinas, acometidas, solares y derribos pequeños, explicados sin jerga." }

  zonas:
    activa: true
    antetitulo: Dónde trabajamos
    titulo: El Bajo Aragón y sesenta kilómetros alrededor
    texto: "Salimos cada mañana desde Alcañiz. Si tu pueblo no está en la lista, llámanos: seguramente también llegamos."
    imagen: /fotos/comarca.jpg
    titulo_pagina: "Excavaciones en {zona}"
    texto_pagina: "Máquinas con conductor, zanjas, explanaciones y derribos en {zona}. Vamos a ver la obra y te damos precio por escrito."
    items:
      - titulo: Alcañiz
        texto: "Es nuestra casa: aquí tenemos la nave y aquí hemos hecho buena parte de nuestras obras, desde acometidas en el casco antiguo hasta explanaciones en los polígonos. Conocemos las calles estrechas de la parte alta, donde solo entra la miniexcavadora, y los caminos de las huertas junto al Guadalope. Trabajamos para el ayuntamiento, para constructoras de la ciudad y para vecinos que hacen una piscina o tiran un corral. Si tienes una urgencia en Alcañiz, llegamos en el día."
      - titulo: Caspe
        texto: "En Caspe y su término hacemos sobre todo caminos rurales, balsas y nivelación de fincas de regadío, y también zanjas para redes nuevas en el pueblo. Muchos trabajos son de concentración parcelaria, con cunetas y firme de zahorra que tienen que aguantar el paso de tractores y camiones. Llevamos la giratoria, el camión y el rodillo juntos para que el tramo quede terminado sin esperas."
      - titulo: Calanda
        texto: "En Calanda trabajamos mucho con almacenes de fruta y explotaciones agrícolas: explanaciones para naves, accesos para camiones y balsas de riego. También hacemos derribos de casas viejas en el pueblo y acometidas para viviendas nuevas. Vamos a ver la parcela, miramos los accesos y te damos un precio por escrito antes de mover una piedra."
      - titulo: Valderrobres
        texto: "En Valderrobres y el resto del Matarraña las calles son estrechas y empinadas y las casas, de piedra. Ahí trabajamos con miniexcavadora y con mucho cuidado: redes de saneamiento, acometidas, muros y accesos a masías. Señalizamos la obra, avisamos a los vecinos y dejamos el pavimento como estaba."
      - titulo: Andorra
      - titulo: Híjar

  proceso:
    activa: true
    antetitulo: Cómo trabajamos
    titulo: De la llamada a la máquina en obra
    texto: Cuatro pasos y un solo interlocutor. Sabes qué se hace, cuándo y cuánto cuesta.
    items:
      - { titulo: Llamas, texto: "Nos cuentas qué hay que hacer y dónde. Si tienes plano o fotos, mejor." }
      - { titulo: Visita, texto: "Vamos a ver el terreno, los accesos y por dónde entra la máquina." }
      - { titulo: Presupuesto, texto: "Te damos el precio por escrito, por horas o por obra cerrada." }
      - { titulo: Obra, texto: "Llegamos el día pactado con la máquina y el conductor que hacen falta." }

  preguntas:
    activa: true
    antetitulo: Preguntas frecuentes
    titulo: Lo que nos preguntan antes de empezar
    preguntas:
      - { pregunta: "¿Alquiláis máquinas sin conductor?", respuesta: "No. Todas nuestras máquinas van con conductor de la casa. Así el trabajo sale bien a la primera y no te preocupas del seguro ni de las averías." }
      - { pregunta: "¿Cobráis por horas o por obra?", respuesta: "Como prefieras. Las máquinas sueltas van por horas, con un mínimo de media jornada. Las obras completas, como una explanación o un derribo, van a precio cerrado por escrito." }
      - { pregunta: "¿Os encargáis de los permisos?", respuesta: "Te decimos qué hace falta y te ayudamos a pedirlo. En derribos y obras en la calle preparamos la documentación de residuos y la señalización." }
      - { pregunta: "¿Qué hacéis con la tierra y el escombro?", respuesta: "La tierra que sirve se reutiliza en la obra. Lo que sobra y el escombro van a vertedero o gestor autorizado, y te damos el justificante." }
      - { pregunta: "¿Con cuánta antelación hay que llamar?", respuesta: "Para una máquina suelta, a menudo podemos ir en dos o tres días. Para obras más grandes, conviene llamar un par de semanas antes." }

  contacto:
    activa: true
    antetitulo: Contacto
    titulo: Pide presupuesto o disponibilidad
    texto: "Cuéntanos dónde es y qué hay que hacer. Te llamamos en el día."
    opciones: "Excavación o explanación; Zanja o acometida; Derribo; Máquina con conductor; Transporte de áridos; Otra consulta"   # «Me interesa» del formulario, separadas por «;» (vacío = sin desplegable)
