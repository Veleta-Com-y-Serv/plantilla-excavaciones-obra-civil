      - { titulo: Transporte de áridos }

  servicios:
    activa: true
    antetitulo: Qué hacemos
    titulo: Trabajos de excavación y obra civil
    texto: "De una zanja para la acometida a la urbanización de un polígono. Con máquina propia y la misma cuadrilla de principio a fin."
    items:
      - titulo: Desmontes y explanaciones
        texto: Dejamos el terreno a la cota que pide el proyecto, listo para cimentar o para cultivar.
        detalle: |
          Antes de levantar una nave, una casa o una balsa hay que dejar el terreno a su altura. Hacemos el desmonte donde sobra tierra y el terraplén donde falta, compactado por tongadas para que no se asiente con el tiempo.

          Trabajamos con giratoria de cadenas, camión bañera y rodillo vibrante, y replanteamos con nivel láser para que la explanada quede a la cota que marca el proyecto. Si la tierra que sale sirve, la reutilizamos en la misma obra; si no, la llevamos a vertedero autorizado y te damos el justificante.

          Vamos a ver la parcela, miramos accesos y tipo de terreno y te damos un precio por escrito. Si hace falta estudio geotécnico o proyecto, te decimos a quién llamar.
      - titulo: Zanjas y canalizaciones
        texto: "Saneamiento, agua, luz y telecomunicaciones: abrimos, colocamos tubo y tapamos."
        detalle: |
          Abrimos zanjas para redes de saneamiento, abastecimiento de agua, riego, electricidad y telecomunicaciones, tanto en calles de pueblo como en fincas y polígonos. Elegimos la máquina por el ancho de la zanja y el sitio que hay: miniexcavadora en calles estrechas y patios, retro mixta o giratoria en campo abierto.

          Colocamos la cama de arena, el tubo y la cinta de señalización, rellenamos por capas y compactamos para que el firme no se hunda. En calle reponemos el pavimento o dejamos la zanja lista para el asfalto.

          Trabajamos para ayuntamientos y para empresas instaladoras, y también hacemos acometidas sueltas para una casa o una nave. Señalizamos la obra y avisamos a los vecinos antes de cortar un paso.
      - titulo: Derribos
        texto: "Casas viejas, corrales, almacenes y naves. Separamos los residuos y dejamos el solar limpio."
        detalle: |
          Derribamos casas en ruina, corrales, almacenes y naves, con máquina y con medios manuales donde hay medianeras que respetar. Antes de empezar revisamos el edificio, pedimos lo que haga falta al ayuntamiento y protegemos las casas de al lado.

          Separamos el escombro, la madera, la chatarra y el resto de residuos y los llevamos cada uno a su gestor autorizado, con los documentos que te pedirá el ayuntamiento para cerrar la licencia. Si hay fibrocemento, lo retira una empresa inscrita para ello antes de que entre la máquina.

          Terminamos con el solar limpio y nivelado, listo para vender o para construir.
      - titulo: Urbanizaciones
        texto: "Viales, aceras, redes y explanadas para polígonos y nuevas calles."
        detalle: |
          Hacemos la parte de tierra y redes de una urbanización: desbroce, apertura de viales, zanjas para saneamiento, agua, luz y telecomunicaciones, sub-base de zahorra compactada y bordillos. Coordinamos con la dirección de obra y con el resto de oficios para que cada fase esté lista cuando llega la siguiente.

          Trabajamos como subcontrata de constructoras y directamente para promotores y ayuntamientos. Llevamos el parte diario de máquinas y horas y lo entregamos con cada certificación.
      - titulo: Caminos y pistas
        texto: "Caminos rurales, accesos a fincas y pistas forestales con cuneta y firme de zahorra."
      - titulo: Muros de escollera
        texto: "Contención de taludes y márgenes de río con piedra de cantera colocada a máquina."
      - titulo: Transporte de áridos
        texto: "Zahorra, grava, arena y tierra vegetal servida en obra con nuestros camiones."

  maquinaria:
    activa: true
    antetitulo: Parque de maquinaria
    titulo: Máquinas con conductor de la casa
    texto: "Todas nuestras, revisadas y con operario con años de oficio. Se alquilan por horas o por días."
    nota: Precios por hora sin IVA, con conductor y gasóleo. Mínimo media jornada. Pregunta la disponibilidad por teléfono.
    cta: { texto: Preguntar disponibilidad, url: "/#contacto" }
    maquinas:
      - nombre: Retroexcavadora mixta
        categoria: Retroexcavadora
        capacidad: "9 t, cazo de 60 cm y martillo"
        uso: "Zanjas, acometidas y carga de camión"
        precio: "desde 48 €/h"
        imagen: /fotos/retro-mixta.jpg
        detalle: |
          La retroexcavadora mixta es la máquina para todo de una obra pequeña o mediana: excava con el brazo de atrás, carga con la pala de delante y se mueve por carretera sin necesidad de góndola. Por eso es la que más pedimos para zanjas, acometidas, pequeños vaciados y carga de camiones.

          La llevamos con cazos de varios anchos, martillo para roca y hormigón y pinza para mover bloques o tubos. El conductor es de la casa y conoce bien la máquina, así que la zanja sale recta y a la profundidad que toca.

          Se alquila por horas o por jornadas, siempre con conductor. Si no sabes qué máquina te hace falta, cuéntanos el trabajo y te lo decimos.
      - nombre: Giratoria de cadenas
        categoria: Giratoria
        capacidad: "22 t, cazo de 1,2 m³"
        uso: "Desmontes, sótanos y escollera"
        precio: "desde 75 €/h"
        imagen: /fotos/giratoria.jpg
        detalle: |
          La giratoria de cadenas es la máquina de los trabajos grandes: desmontes, vaciados de sótanos, apertura de caminos y colocación de escollera. Gira entera sobre sus cadenas, así que trabaja sin moverse y carga el camión desde el mismo sitio.

          Tiene cazo de excavación, cazo de limpieza para taludes y pinza para colocar piedra de escollera. Con terreno duro le montamos el martillo. Llega a obra en góndola, y el transporte va incluido en el presupuesto.

          Siempre va con conductor de la casa. Te ayudamos a calcular cuántos días hacen falta para que no pagues horas de más.
      - nombre: Miniexcavadora
        categoria: Miniexcavadora
        capacidad: "3 t, 1,5 m de ancho"
        uso: "Patios, jardines y accesos estrechos"
        precio: "desde 40 €/h"
        imagen: /fotos/miniexcavadora.jpg
        detalle: |
          La miniexcavadora entra donde no cabe otra máquina: por la puerta de un corral, en un patio interior, en una calle del casco antiguo o en un jardín ya hecho. Pesa poco, apenas marca el suelo y hace zanjas finas para tubos, cables y riego.

          Va sobre cadenas de goma y la llevamos con cazos estrechos y anchos y con martillo pequeño. Es la máquina de las piscinas, las acometidas de una casa y las obras dentro de un pueblo.

          Se alquila con conductor por horas o por jornadas. Si el acceso es muy justo, vamos antes a medirlo.
      - nombre: Camión bañera
        categoria: Camión
        capacidad: "32 t de carga, 4 ejes"
        uso: "Tierras, áridos y escombro"
        precio: "desde 60 €/h"
        imagen: /fotos/camion-banera.jpg
      - nombre: Rodillo compactador
        categoria: Rodillo
        capacidad: "12 t, vibrante"
        uso: "Explanadas, caminos y zahorras"
        precio: "desde 55 €/h"
        imagen: /fotos/rodillo.jpg

