secciones:
  hero:
    activa: true
    antetitulo: Excavaciones y obra civil en Alcañiz
    titulo: Movemos tierra en todo el Bajo Aragón
    texto: Retros, giratorias, camiones y rodillos con conductor de la casa. Vamos a ver la obra y te damos precio por escrito.
    imagen: /fotos/hero.jpg
    pie_foto: Desmonte para una nave agrícola en Calanda
    cta: { texto: Pedir presupuesto, url: "/#contacto" }
    cta_secundario: { texto: Ver la maquinaria, url: "/#maquinaria" }
